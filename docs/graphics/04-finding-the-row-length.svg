rect x="700" y="270" width="46" height="46" rx="6" fill="#9B7BFF" stroke-width="3" /><rect x="494" y="114" width="58" height="206" rx="10" fill="none" stroke-width="4" stroke="#2EC4B6" stroke-dasharray="10 8"/><text x="625" y="350" font-size="16" font-weight="400" fill="#22304A" stroke="none" text-anchor="middle">Columns line up, so the pattern stacks</text>
<text x="400.0" y="436" font-size="19" fill="#22304A" stroke="none" text-anchor="middle">Record detection: measure the row, line the rows up, and the repeats compress easily.</text>
